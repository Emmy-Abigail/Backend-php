  schemas:
    RegisterPackageRequest:
      type: object
      additionalProperties: false
      required: [remitente, destinatario, direccion, peso_kg, largo_cm, ancho_cm, alto_cm]
      properties:
        remitente:
          type: object
          additionalProperties: false
          required: [tipo_documento, numero_documento, nombres, celular]
          properties:
            tipo_documento:
              type: string
              enum: [DNI, RUC]
            numero_documento:
              type: string
              description: 8 digitos para DNI; 11 para RUC
              example: '45678912'
            nombres:
              type: string
              minLength: 1
              maxLength: 150
              description: Nombres o razon social
            celular:
              type: string
              description: Celular peruano de 9 digitos; admite prefijo +51 y espacios
              example: '+51 987654321'
        destinatario:
          type: object
          additionalProperties: false
          required: [nombres, dni, celular]
          properties:
            nombres:
              type: string
              minLength: 1
              maxLength: 150
            dni:
              type: string
              pattern: '^[0-9]{8}$'
              example: '41234567'
            celular:
              type: string
              example: '912345678'
        direccion:
          type: object
          additionalProperties: false
          required: [ubigeo_distrito, tipo_via, nombre_via]
          properties:
            ubigeo_distrito:
              type: string
              pattern: '^[0-9]{6}$'
              example: '150122'
            tipo_via:
              type: string
              minLength: 1
              maxLength: 20
              example: Av.
            nombre_via:
              type: string
              minLength: 1
              maxLength: 120
            numero:
              type: string
              nullable: true
              maxLength: 10
            manzana:
              type: string
              nullable: true
              maxLength: 10
            lote:
              type: string
              nullable: true
              maxLength: 10
            referencia:
              type: string
              nullable: true
              maxLength: 255
        peso_kg:
          description: Entre 0.1 y 50 kg; hasta 2 decimales efectivos, sin redondeo silencioso
          oneOf:
            - type: number
              minimum: 0.1
              maximum: 50
              multipleOf: 0.01
            - type: string
              pattern: '^[0-9]+(\.[0-9]+)?$'
          example: 3
        largo_cm:
          $ref: '#/components/schemas/PackageDimension'
        ancho_cm:
          $ref: '#/components/schemas/PackageDimension'
        alto_cm:
          $ref: '#/components/schemas/PackageDimension'

    PackageDimension:
      description: Entre 10 y 150 cm; hasta 1 decimal efectivo, sin redondeo silencioso
      oneOf:
        - type: number
          minimum: 10
          maximum: 150
          multipleOf: 0.1
        - type: string
          pattern: '^[0-9]+(\.[0-9]+)?$'
      example: 30

    RegisterPackageResponse:
      type: object
      required: [id, tracking_id, estado, fecha_ingreso, cotizacion, lote]
      properties:
        id:
          type: integer
        tracking_id:
          type: string
          description: Codigo aleatorio unico de 10 caracteres no ambiguos
        estado:
          type: string
          enum: [EN_ALMACEN]
        fecha_ingreso:
          type: string
          format: date-time
        cotizacion:
          type: object
          required: [id_tarifa, monto]
          properties:
            id_tarifa:
              type: integer
            monto:
              type: number
        lote:
          type: object
          required: [id, codigo, estado, id_tipo_vehiculo, vehiculo, zona]
          properties:
            id:
              type: integer
            codigo:
              type: string
            estado:
              type: string
              enum: [EN_PREPARACION]
            id_tipo_vehiculo:
