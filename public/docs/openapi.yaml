openapi: 3.0.3
info:
  title: Sistema de GestiÃ³n de EnvÃ­os API
  version: 1.0.0
  description: |
    DocumentaciÃ³n de la API de RIVA - Sistema de GestiÃ³n de EnvÃ­os.
    Arquitectura Hexagonal con PHP 8.4 y Slim Framework 4.

    ## Convenciones de Respuestas de Error
    Todas las respuestas de error siguen el contrato uniforme:
    ```json
    {
      "message": "DescripciÃ³n legible del error",
      "error": "codigo_error_en_snake_case"
    }
    ```

    ## Rutas Pendientes
    Las rutas marcadas como **Pendiente** responden con cÃ³digo `501 Endpoint aÃºn no implementado`.
servers:
  - url: /
    description: Servidor actual
tags:
  - name: Salud
  - name: AutenticaciÃ³n
  - name: Usuarios
  - name: CatÃ¡logos
  - name: Cotizaciones
  - name: Paquetes (prÃ³ximamente)
  - name: Lotes
  - name: Lotes (prÃ³ximamente)
  - name: Conductor (prÃ³ximamente)
  - name: Entregas (prÃ³ximamente)
  - name: Seguimiento (prÃ³ximamente)
  - name: Dashboard (prÃ³ximamente)
