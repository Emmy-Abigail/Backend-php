                            ubigeo:
                              type: string
                              example: '150122'
                            ubigeo_provincia:
                              type: string
                            id_zona:
                              type: integer
                            nombre_oficial:
                              type: string
                            nombre_mostrado:
                              type: string
                            lat:
                              type: number
                            lng:
                              type: number
                            activo:
                              type: boolean
                      vehiculos:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            codigo:
                              type: string
                            nombre:
                              type: string
                            nivel:
                              type: integer
                            peso_max_total_kg:
                              type: number
                            lado_max_cm:
                              type: number
                            max_paquetes:
                              type: integer
                      motivos_fallo:
                        type: array
                        items:
                          type: object
                          properties:
                            id:
                              type: integer
                            codigo:
                              type: string
                            nombre:
                              type: string
  /api/v1/quotes:
    post:
      tags: [Cotizaciones]
      summary: Cotizar un envio sin guardarlo
      description: |
        Requiere rol OPERADOR. Calcula el precio de un envio antes de registrarlo y no guarda nada.
        El origen es la sede del operador autenticado: sale de la sesion y no del cuerpo.

        Formula:
        - peso volumetrico = largo x ancho x alto / 5000
        - peso facturable = el mayor entre el peso real y el volumetrico
        - monto = peso facturable x tarifa base por kg x factor de zona, redondeado a 2 decimales (half-up)

        Factor de zona: misma zona 1.0; Centro con cualquier otra 1.2; entre zonas perifericas 1.5.
        Limites: peso de 0.1 a 50 kg (hasta 2 decimales) y cada lado de 10 a 150 cm (hasta 1 decimal).
        Valida las mismas medidas que el registro de paquetes, sin redondear la entrada.
        Los ceros finales no cuentan como precision adicional; los excesos de limites o precision responden 422.
        La tarifa base es la fila de `tarifas` con la vigencia mas reciente.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteRequest'
            example:
              ubigeo_destino: "150140"
              peso_kg: 25
              largo_cm: 12
              ancho_cm: 30
              alto_cm: 20
      responses:
        '200':
          description: Cotizacion calculada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          description: No hay una tarifa base vigente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: No hay una tarifa base vigente
                error: tarifa_no_configurada

  /api/v1/packages:
    get:
      tags: [Paquetes (prÃ³ximamente)]
      summary: Listar paquetes de la sede del operador
      operationId: listPackages
      description: |
        Solo OPERADOR con sede y cambio inicial de password completado.
        La sede sale de la sesion; no se acepta como parametro.
        Ordena del ingreso mas reciente al mas antiguo.
        Los filtros de fecha representan dias completos de America/Lima; la BD guarda UTC.
        Las fechas de respuesta se devuelven en ISO 8601 con offset -05:00.
        Los filtros deben ser textos simples; listas u objetos se rechazan con 422.
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          description: Busca por inicio de tracking o DNI del destinatario, o por parte de su nombre. Maximo 100 caracteres.
          schema:
            type: string
            example: '7123'
        - name: estado
          in: query
          schema:
            type: string
            enum: [EN_ALMACEN, ASIGNADO, EN_RUTA, ENTREGADO, FALLIDO]
        - name: desde
          in: query
          description: Fecha de ingreso desde (inclusive), AAAA-MM-DD en America/Lima.
          schema:
            type: string
            format: date
        - name: hasta
          in: query
          description: Fecha de ingreso hasta (inclusive), AAAA-MM-DD en America/Lima.
          schema:
            type: string
            format: date
        - name: page
          in: query
          description: Entero positivo; se rechaza con 422 si el desplazamiento calculado con per_page excede el rango entero.
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: per_page
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Pagina de paquetes
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        tracking_id:
                          type: string
                        destinatario:
                          type: object
                          properties:
                            nombres:
                              type: string
                            dni:
                              type: string
                        destino:
                          type: object
                          properties:
                            ubigeo:
                              type: string
                            distrito:
                              type: string
                        peso_kg:
                          type: number
                        costo_estimado:
                          type: string
                          example: '15.50'
                        estado:
                          type: object
                          properties:
                            codigo:
                              type: string
                            nombre:
                              type: string
                        id_lote:
                          type: integer
                          nullable: true
                        orden_parada:
                          type: integer
                          nullable: true
                        fecha_ingreso:
                          type: string
                          format: date-time
                          example: '2026-10-22T10:15:00-05:00'
                  meta:
                    type: object
                    properties:
                      page:
                        type: integer
                      per_page:
                        type: integer
                      total:
                        type: integer
                      total_pages:
                        type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
    post:
      tags: [Paquetes (prÃ³ximamente)]
      summary: Registrar paquete con asignacion automatica de lote
      operationId: registerPackage
      description: |
        Solo OPERADOR con sede y cambio inicial de password completado.
        La sede, tracking, estado, precio y lote los establece el backend.
        Calcula el precio en PHP con la tarifa vigente y el mismo calculo de /quotes.
        Solicita a Python la asignacion y guarda remitente, lote, paquete e historial
        en una transaccion. No requiere llamar a /quotes antes del registro.
        Si no hay tarifa vigente o falla Python, responde 503 sin guardado parcial.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterPackageRequest'
      responses:
        '201':
          description: Registro atomico completado con precio real y lote asignado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterPackageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Conflicto de registros concurrentes; volver a intentar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Campos invalidos o sede/distrito inexistente o inactivo; campos contiene los errores del formulario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: datos_invalidos
                message: Revisa los campos del paquete
                campos:
                  peso_kg: Debe estar entre 0.1 y 50 kg
        '503':
          description: Tarifa ausente/invalida o fallo del servicio de asignacion; sin guardado parcial
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                cotizacionNoDisponible:
                  value:
                    error: cotizacion_no_disponible
                    message: Servicio de cotizacion no disponible
                asignacionNoDisponible:
                  value:
                    error: asignacion_no_disponible
                    message: Servicio de asignacion no disponible

  /api/v1/packages/{id}:
    get:
      tags: [Paquetes (prÃ³ximamente)]
      summary: Consultar el detalle e historial de un paquete
      operationId: getPackage
      description: |
