                      type: string
                      example: '998877665'
      responses:
        '201':
          description: Reintento registrado como paquete nuevo
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/RegisterPackageResponse'
                  - type: object
                    properties:
                      id_paquete_origen:
                        type: integer
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
