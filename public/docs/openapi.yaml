                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        nombre:
                          type: string
                        direccion:
                          type: string
                        departamento:
                          type: string
                        provincia:
                          type: string
                        distrito:
                          type: string
                        ubigeo:
                          type: string
                        latitud:
                          type: number
                        longitud:
                          type: number
                        activo:
                          type: boolean

  /api/v1/vehicle-types:
    get:
      security:
        - bearerAuth: []
      tags: [CatÃ¡logos]
      summary: Listar tipos de vehÃ­culos
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Lista de tipos de vehÃ­culos con capacidades
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        nombre:
                          type: string
                        capacidad_peso_kg:
                          type: number
                        capacidad_volumen_m3:
                          type: number
                        activo:
                          type: boolean

  /api/v1/failure-reasons:
    get:
      security:
        - bearerAuth: []
      tags: [CatÃ¡logos]
      summary: Listar motivos de fallos de entrega
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Lista de motivos de fallo
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        codigo:
                          type: string
                        descripcion:
                          type: string

  /api/v1/catalogs:
    get:
      security:
        - bearerAuth: []
      tags: [CatÃ¡logos]
      summary: Obtener en una sola llamada los catálogos del registro de paquetes
      description: Reúne los distritos (lista plana, sin anidar por departamento y provincia), los tipos de vehículo y los motivos de fallo. Reutiliza los mismos servicios que /geography, /vehicle-types y /failure-reasons.
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Catálogos agrupados
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      distritos:
                        type: array
                        items:
                          type: object
