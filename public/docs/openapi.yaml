                          type: number
                        activo:
                          type: boolean

  /api/v1/vehicle-types:
    get:
      tags: [CatÃ¡logos]
      summary: Listar tipos de vehÃ­culos
      responses:
        '200':
          description: Lista de tipos de vehÃ­culos con capacidades
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        nombre:
                          type: string
                        capacidad_peso_kg:
                          type: number
                        capacidad_volumen_m3:
                          type: number
                        activo:
                          type: boolean

  /api/v1/failure-reasons:
    get:
      tags: [CatÃ¡logos]
      summary: Listar motivos de fallos de entrega
      responses:
        '200':
          description: Lista de motivos de fallo
          content:
            application/json:
              schema:
                type: object
