components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    PackageId:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: Identificador del paquete
    BatchId:
      name: id
      in: path
      required: true
      schema:
        type: integer
      description: Identificador del lote
    TrackingId:
      name: trackingId
      in: path
      required: true
      schema:
        type: string
      description: CÃ³digo de seguimiento

  responses:
    NotImplemented:
      description: Endpoint registrado, pero su funcionalidad aÃºn no estÃ¡ implementada
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageResponse'
          example:
            message: Endpoint aÃºn no implementado
    BadRequest:
      description: Solicitud invÃ¡lida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: Solicitud invÃ¡lida.
            error: solicitud_invalida
    Unauthorized:
      description: Token invÃ¡lido, ausente o credenciales incorrectas
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: Credenciales incorrectas
            error: credenciales_incorrectas
    Forbidden:
      description: Acceso no autorizado o acciÃ³n no permitida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: Acceso no autorizado
            error: acceso_no_autorizado
    ValidationError:
      description: Datos de entrada con formato invÃ¡lido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: Los datos enviados no son vÃ¡lidos.
            error: validacion_fallida

  schemas:
    LoginRequest:
      type: object
      required: [correo, password]
      properties:
        correo:
          type: string
          format: email
          example: operador@ejemplo.com
        password:
          type: string
          format: password
          example: ClaveTemporal2026@

    LoginResponse:
      type: object
      required: [token, token_type, expires_at, user]
      properties:
        token:
          type: string
          description: JWT emitido para autenticaciÃ³n.
        token_type:
          type: string
          example: Bearer
        expires_at:
          type: string
          format: date-time
          example: "2026-10-06T12:00:00-05:00"
        user:
          $ref: '#/components/schemas/User'

    ChangePasswordRequest:
      type: object
      required: [password_nuevo]
      properties:
        password_actual:
          type: string
          format: password
          description: Obligatoria solo si debe_cambiar_password es false en la base de datos. Ignorada en el primer cambio obligatorio.
          example: ClaveTemporal2026@
        password_nuevo:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          description: Debe cumplir PasswordPolicy y ser diferente de la clave almacenada.
          example: NuevaClaveSegura2026#

    ChangePasswordResponse:
      type: object
      required: [message, token, token_type, expires_at]
      properties:
        message:
          type: string
          example: ContraseÃ±a actualizada exitosamente
        token:
          type: string
          description: Nuevo JWT emitido para reemplazar el anterior.
        token_type:
          type: string
          example: Bearer
        expires_at:
          type: string
          format: date-time
          example: "2026-10-06T12:00:00-05:00"

    PasswordResetRequest:
      type: object
      required: [correo]
      properties:
        correo:
          type: string
          format: email
          maxLength: 150
          example: ana.perez@ejemplo.com

    PasswordResetConfirmRequest:
      type: object
      required: [token, password_nuevo]
      properties:
        token:
          type: string
          description: Token hexadecimal de 64 caracteres recibido por correo.
        password_nuevo:
          type: string
          format: password
          minLength: 8
          maxLength: 72
          example: NuevaClaveSegura2026#

    CreateUserRequest:
      type: object
      required: [nombres, correo, rol]
      properties:
        nombres:
          type: string
          maxLength: 150
          example: Carlos Mendoza
        correo:
          type: string
          format: email
          maxLength: 150
          example: carlos.mendoza@ejemplo.com
        rol:
          type: string
          enum: [ADMINISTRADOR, OPERADOR, CONDUCTOR]
          example: OPERADOR
        dni:
          type: string
          maxLength: 8
          nullable: true
          example: '12345678'
        telefono:
          type: string
          maxLength: 20
          nullable: true
          example: '+51987654321'
        id_sede:
          type: integer
          nullable: true
          example: 1
        id_tipo_vehiculo:
          type: integer
          nullable: true
          example: 1

    CreateUserResponse:
      type: object
      required: [id, nombres, correo, rol, correo_enviado]
      properties:
        id:
          type: integer
          example: 5
        nombres:
          type: string
          example: Carlos Mendoza
        correo:
          type: string
          format: email
          example: carlos.mendoza@ejemplo.com
        rol:
          type: string
          enum: [ADMINISTRADOR, OPERADOR, CONDUCTOR]
          example: OPERADOR
        correo_enviado:
          type: boolean
          description: Indica si el correo con las credenciales temporales fue entregado exitosamente.
          example: true

    ChangeUserStatusRequest:
      type: object
      required: [activo]
      properties:
        activo:
