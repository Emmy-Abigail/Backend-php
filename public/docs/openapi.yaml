                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                        codigo:
                          type: string
                        descripcion:
                          type: string

  /api/v1/packages:
    get:
      tags: [Paquetes (prÃ³ximamente)]
      summary: '[Pendiente] Listar paquetes'
      responses:
        '501':
          $ref: '#/components/responses/NotImplemented'
    post:
      tags: [Paquetes (prÃ³ximamente)]
      summary: '[Pendiente] Crear paquete'
      responses:
        '501':
          $ref: '#/components/responses/NotImplemented'

  /api/v1/packages/{id}:
    get:
      tags: [Paquetes (prÃ³ximamente)]
