openapi: 3.0.3
info:
  title: Sistema de GestiÃ³n de EnvÃ­os API
  version: 1.0.0
  description: |
    DocumentaciÃ³n de la API de RIVA - Sistema de GestiÃ³n de EnvÃ­os.
    Arquitectura Hexagonal con PHP 8.4 y Slim Framework 4.

    ## Convenciones de Respuestas de Error
    Todas las respuestas de error siguen el contrato uniforme:
    ```json
    {
      "message": "DescripciÃ³n legible del error",
      "error": "codigo_error_en_snake_case"
    }
    ```

    ## Rutas Pendientes
    Las rutas marcadas como **Pendiente** responden con cÃ³digo `501 Endpoint aÃºn no implementado`.
servers:
  - url: /
    description: Servidor actual
tags:
  - name: Salud
  - name: AutenticaciÃ³n
  - name: Usuarios
  - name: CatÃ¡logos
  - name: Cotizaciones
  - name: Paquetes (prÃ³ximamente)
  - name: Lotes
  - name: Conductor
  - name: Entregas
  - name: Lotes (prÃ³ximamente)
  - name: Conductor (prÃ³ximamente)
  - name: Entregas (prÃ³ximamente)
  - name: Seguimiento (prÃ³ximamente)
  - name: Dashboard (prÃ³ximamente)
  - name: Zonas (prÃ³ximamente)

paths:
  /health:
    get:
      tags: [Salud]
      summary: VerificaciÃ³n de estado del servidor (Health Check)
      responses:
        '200':
          description: Servidor en lÃ­nea y respondiendo
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok

  /api/v1/auth/login:
    post:
      tags: [AutenticaciÃ³n]
      summary: Iniciar sesiÃ³n
      description: |
        Autentica al usuario con correo y contraseÃ±a.
        Retorna el token JWT con expiraciÃ³n en zona horaria America/Lima (-05:00).
        Para usuarios con rol OPERADOR se incluye el objeto sede {id, nombre}.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Inicio de sesiÃ³n exitoso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/auth/me:
    get:
      tags: [AutenticaciÃ³n]
      summary: Obtener perfil del usuario autenticado
      description: Retorna la informaciÃ³n del usuario del token JWT activo.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Perfil de usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/session:
    get:
      tags: [Autenticación]
      summary: Verificar que la sesión sigue vigente (polling)
      description: Endpoint liviano para que el cliente consulte periódicamente. Responde 401 si el token expiró, es inválido o el usuario fue desactivado; en ese caso el cliente debe cerrar la sesión local.
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Sesión vigente
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/v1/auth/change-password:
    patch:
      tags: [AutenticaciÃ³n]
      summary: Cambiar contraseÃ±a
      description: |
        Permite al usuario cambiar su contraseÃ±a. 
        PolÃ­tica de contraseÃ±a:
        - Longitud entre 8 y 72 caracteres.
        - Al menos una letra mayÃºscula.
        - Al menos un nÃºmero.
        - Al menos un sÃ­mbolo permitido (@, #, $, %, &).
        
        Al cambiarse la contraseÃ±a se actualiza password_changed_at en BD, 
        se invalidan los tokens JWT anteriores y se devuelve un nuevo JWT activo.

        El servicio consulta el estado actual del usuario en la base de datos.
        Si debe_cambiar_password es true, solo se exige password_nuevo y se ignora
        password_actual por completo, incluso si se incluye con un valor incorrecto.
        Si debe_cambiar_password es false, password_actual es obligatoria y debe
        coincidir con la almacenada. Un indicador enviado por el cliente no permite
        omitir esta comprobacion. En ambos casos se verifica la nueva clave contra
        el hash almacenado para impedir reutilizar la misma clave.
        El cambio establece debe_cambiar_password en false. El frontend debe
        reemplazar su JWT por el token devuelto en la respuesta.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
            examples:
              primerCambio:
                summary: Primer cambio obligatorio
                value:
                  password_nuevo: NuevaClaveSegura2026@
              primerCambioCompatible:
                summary: Compatibilidad con el frontend actual
                value:
                  password_actual: Temporal123!
                  password_nuevo: NuevaClaveSegura2026@
              cambioNormal:
                summary: Cambio posterior con clave actual
                value:
                  password_actual: ClaveActual2026@
                  password_nuevo: NuevaClaveSegura2026#
      responses:
        '200':
          description: ContraseÃ±a actualizada exitosamente con nuevo JWT emitido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangePasswordResponse'
        '400':
          description: Cuerpo invalido, password_nuevo ausente o invalida; en un cambio normal, password_actual ausente, invalida o incorrecta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: La contraseÃ±a actual es incorrecta.
                error: password_actual_incorrecta
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: Nueva contraseÃ±a no cumple la polÃ­tica
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: La nueva contraseÃ±a no cumple con los requisitos de seguridad.
                error: password_invalida

  /api/v1/auth/password-reset/request:
    post:
      tags: [AutenticaciÃ³n]
      summary: Solicitar recuperaciÃ³n de contraseÃ±a
      description: Genera un token de recuperaciÃ³n y lo envÃ­a por correo electrÃ³nico.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequest'
      responses:
        '202':
          description: Solicitud recibida. Si el correo existe, se enviaron instrucciones.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/auth/password-reset/confirm:
    post:
      tags: [AutenticaciÃ³n]
      summary: Confirmar restablecimiento de contraseÃ±a
      description: Valida el token de recuperaciÃ³n y actualiza la contraseÃ±a del usuario.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
      responses:
        '200':
          description: ContraseÃ±a restablecida exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Token invÃ¡lido, expirado o ya utilizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: El token de recuperaciÃ³n es invÃ¡lido o ha expirado.
                error: token_invalido
        '422':
          description: La nueva contraseÃ±a no cumple los requisitos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: La contraseÃ±a no cumple los requisitos de seguridad.
                error: password_invalida

  /api/v1/users:
    get:
      tags: [Usuarios]
      summary: Listar personal registrado
      description: |
        Requiere rol ADMINISTRADOR.
        Si el usuario tiene debe_cambiar_password = true, el acceso a este endpoint
        es bloqueado por MustChangePasswordMiddleware con error 403.
        Retorna la lista completa de usuarios incluyendo sede y tipo de vehÃ­culo.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de personal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Rol insuficiente o cambio de contraseÃ±a obligatorio pendiente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Debe cambiar su contraseÃ±a antes de continuar
                error: cambio_password_requerido

    post:
      tags: [Usuarios]
      summary: Crear usuario
      description: |
        Requiere rol ADMINISTRADOR.
        Genera una contraseÃ±a temporal segura de 12 caracteres y la envÃ­a por correo electrÃ³nico.
        Si el envÃ­o SMTP falla, el usuario se crea igualmente (retorna correo_enviado: false).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: Usuario creado exitosamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateUserResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Correo electrÃ³nico o DNI ya registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Ya existe un usuario con ese correo electrÃ³nico.
                error: correo_duplicado
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/users/{id}/status:
    patch:
      tags: [Usuarios]
      summary: Cambiar estado activo/inactivo de un usuario
      description: |
        Requiere rol ADMINISTRADOR.
        Permite activar o desactivar una cuenta de usuario.
        Reglas de seguridad:
        - Un administrador NO puede desactivar su propia cuenta.
        - NO se permite desactivar cuentas con rol ADMINISTRADOR.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
          description: ID del usuario
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeUserStatusRequest'
      responses:
        '200':
          description: Estado del usuario actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChangeUserStatusResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Intento de desactivar la propia cuenta o a otro administrador
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: No puedes desactivar tu propia cuenta de usuario.
                error: no_se_puede_desactivar_a_si_mismo
        '404':
          description: Usuario no encontrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Usuario no encontrado.
                error: usuario_no_encontrado
        '422':
          $ref: '#/components/responses/ValidationError'

  /api/v1/geography:
    get:
      security:
        - bearerAuth: []
      tags: [CatÃ¡logos]
      summary: Obtener catÃ¡logo de geografÃ­a (Departamentos, Provincias y Distritos)
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: Estructura geogrÃ¡fica
          content:
            application/json:
              schema:
                type: object
                properties:
                  departamentos:
                    type: array
                    items:
                      type: object

  /api/v1/sedes:
    get:
      security:
        - bearerAuth: []
      tags: [CatÃ¡logos]
      summary: Listar sedes operativas activas
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
