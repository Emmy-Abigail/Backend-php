  /api/v1/batches/{id}/start-route:
    post:
      tags: [Conductor]
      summary: Iniciar la ruta de un lote asignado
      operationId: startBatchRoute
      description: |
        Solo CONDUCTOR activo con el cambio inicial de password completado (HU-39 y HU-40).
        No requiere cuerpo: el conductor se obtiene del JWT y el lote del path.
        El lote debe pertenecerle, estar ASIGNADO y tener al menos un paquete;
        todos sus paquetes deben estar ASIGNADOS. Conserva el orden de paradas del despacho.
        Solo permite un lote EN_RUTA por conductor, incluso ante peticiones simultaneas.
        Guarda estado, started_at, estados de paquetes e historial en una sola transaccion.
        No consulta Python. Un segundo inicio no duplica eventos ni cambia la hora de salida.
