  /api/v1/batches:
    get:
      tags: [Lotes]
      summary: Listar lotes
      description: |
        Requiere rol OPERADOR o CONDUCTOR.

        - **Operador:** lotes de su sede (la sede sale de la sesion). Sin filtro `estado` devuelve todos los estados.
        - **Conductor:** solo sus lotes. Sin filtro `estado` devuelve los Asignados y En Ruta.

        Orden: los lotes `EN_PREPARACION` salen del mas antiguo al mas nuevo (es el que se despacha primero);
        el resto, del mas nuevo al mas antiguo. Los lotes se crean solos al registrar un paquete y el conductor
        se asigna al despachar.
      security:
        - bearerAuth: []
      parameters:
        - name: estado
          in: query
          required: false
          schema:
            type: string
            enum: [EN_PREPARACION, ASIGNADO, EN_RUTA, CERRADO]
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Pagina de lotes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Filtro invalido (estado, page o size)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: El filtro estado debe ser EN_PREPARACION, ASIGNADO, EN_RUTA o CERRADO
