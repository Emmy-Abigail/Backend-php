  /api/v1/packages/{id}/retry:
    post:
      tags: [Paquetes (prÃ³ximamente)]
      summary: Crear el reintento de un paquete FALLIDO
      operationId: retryPackage
      description: |
        Solo OPERADOR de la sede del paquete, con el cambio inicial de password completado.
        Crea un paquete nuevo (tracking, precio y lote nuevos) reutilizando el registro:
        precio con la tarifa vigente y asignacion automatica de lote con Python.
        Copia remitente, destinatario, direccion y medidas del paquete fallido; el cuerpo es
        opcional y solo permite corregir la direccion y el celular del destinatario.
        Cada paquete admite un solo reintento propio; si el reintento tambien falla, se puede reintentar,
        hasta un maximo de 3 reintentos por envio (el original mas 3 reintentos).
        El paquete original se mantiene FALLIDO; el nuevo guarda su id en id_paquete_origen.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PackageId'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                direccion:
                  type: object
                  description: Solo los campos a corregir; el resto se copia del paquete fallido.
                  additionalProperties: false
                  properties:
                    ubigeo_distrito:
                      type: string
                    tipo_via:
                      type: string
                    nombre_via:
                      type: string
                    numero:
                      type: string
                    manzana:
                      type: string
                    lote:
                      type: string
                    referencia:
                      type: string
                destinatario:
                  type: object
                  additionalProperties: false
                  properties:
