            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: El id del lote no es valido
                error: id_invalido

  /api/v1/batches/{id}/dispatch:
    post:
      tags: [Lotes]
      summary: Despachar un lote a un conductor
      description: |
        Requiere rol OPERADOR y un lote de su sede en estado `EN_PREPARACION`.

        1. Lee el lote y pide a Python el orden de las paradas (vecino mas cercano desde la sede).
        2. En una sola transaccion bloquea el lote, sus paquetes y el conductor, y revalida todo.
        3. Guarda el conductor, el operador que despacha y la fecha; pasa el lote a `ASIGNADO` y sus paquetes a
           `ASIGNADO` con su numero de parada; registra un evento de historial por paquete; incrementa `version`.

        Si entra un paquete nuevo mientras se calcula la ruta, el despacho se repite (hasta 3 intentos) para que el
        orden incluya todos los paquetes del lote.

        El conductor debe estar activo, manejar el tipo de vehiculo del lote y tener menos de 3 lotes pendientes.
        Antes de guardar se revalida que la suma de pesos actuales no supere la capacidad vigente
        del tipo de vehiculo, dentro de la transaccion. El limite exacto se acepta.
        Si se excede, responde 409 capacidad_excedida sin cambiar lote, paquetes ni historial.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BatchId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DispatchBatchRequest'
            example:
              id_conductor: 31
              version: 0
      responses:
        '200':
          description: Lote despachado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispatchBatchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Lote de otra sede, rol sin permiso o contrasena temporal sin cambiar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: No puede despachar lotes de otra sede
                error: sin_permisos
        '404':
          description: El lote no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: El lote no existe
                error: lote_no_encontrado
        '409':
          description: |
            Conflicto. `error` puede ser:
            `lote_ya_despachado` (otro operador se adelanto; el mensaje nombra al operador y al conductor),
            `version_desactualizada` (la version enviada no es la actual),
            `lote_cambio` (el lote cambio durante el despacho y se agotaron los reintentos),
            `capacidad_excedida` (el peso total supera la capacidad vigente del vehiculo),
            `lote_vacio` o
            `conductor_no_disponible` (inactivo o con 3 lotes pendientes).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                loteYaDespachado:
                  value:
                    message: Este lote ya fue despachado por Ana Torres a Luis Ramos
                    error: lote_ya_despachado
                conductorNoDisponible:
                  value:
                    message: El conductor ya no esta disponible
                    error: conductor_no_disponible
                capacidadExcedida:
                  value:
                    message: El peso total del lote supera la capacidad del vehiculo
                    error: capacidad_excedida
        '422':
          description: |
            Cuerpo o id invalidos (`campo_obligatorio`, `campo_invalido`, `id_invalido`) o conductor inexistente
            o que no maneja el tipo de vehiculo del lote (`referencia_invalida`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: El conductor no maneja el tipo de vehiculo del lote
                error: referencia_invalida
        '503':
          description: El servicio de rutas (Python) no esta disponible. No se guarda nada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Servicio de rutas no disponible
                error: ruta_no_disponible

