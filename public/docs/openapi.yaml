  schemas:
    StartRouteResponse:
      type: object
      required: [id, codigo, estado, started_at, cantidad_paquetes]
      properties:
        id:
          type: integer
          example: 210
        codigo:
          type: string
          example: L-ABC123
        estado:
          type: string
          enum: [EN_RUTA]
        started_at:
          type: string
          format: date-time
          description: Hora de salida en ISO 8601 con zona horaria de Lima; se guarda en UTC.
          example: '2026-10-24T10:30:00-05:00'
        cantidad_paquetes:
          type: integer
          minimum: 1
          example: 2

    RegisterPackageRequest:
      type: object
      additionalProperties: false
      required: [remitente, destinatario, direccion, peso_kg, largo_cm, ancho_cm, alto_cm]
      properties:
        remitente:
          type: object
          additionalProperties: false
          required: [tipo_documento, numero_documento, nombres, celular]
          properties:
            tipo_documento:
              type: string
              enum: [DNI, RUC]
            numero_documento:
              type: string
              description: 8 digitos para DNI; 11 para RUC
              example: '45678912'
            nombres:
              type: string
              minLength: 1
              maxLength: 150
              description: Nombres o razon social
            celular:
              type: string
              description: Celular peruano de 9 digitos; admite prefijo +51 y espacios
              example: '+51 987654321'
        destinatario:
          type: object
          additionalProperties: false
          required: [nombres, dni, celular]
          properties:
            nombres:
              type: string
              minLength: 1
              maxLength: 150
            dni:
              type: string
              pattern: '^[0-9]{8}$'
              example: '41234567'
            celular:
              type: string
              example: '912345678'
        direccion:
          type: object
          additionalProperties: false
          required: [ubigeo_distrito, tipo_via, nombre_via]
          properties:
            ubigeo_distrito:
              type: string
              pattern: '^[0-9]{6}$'
              example: '150122'
            tipo_via:
              type: string
