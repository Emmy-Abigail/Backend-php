                              type: string
  /api/v1/quotes:
    post:
      tags: [Cotizaciones]
      summary: Cotizar un envio sin guardarlo
      description: |
        Requiere rol OPERADOR. Calcula el precio de un envio antes de registrarlo y no guarda nada.
        El origen es la sede del operador autenticado: sale de la sesion y no del cuerpo.

        Formula:
        - peso volumetrico = largo x ancho x alto / 5000
        - peso facturable = el mayor entre el peso real y el volumetrico
        - monto = peso facturable x tarifa base por kg x factor de zona, redondeado a 2 decimales (half-up)

        Factor de zona: misma zona 1.0; Centro con cualquier otra 1.2; entre zonas perifericas 1.5.
        Limites: peso de 0.1 a 50 kg (hasta 2 decimales) y cada lado de 10 a 150 cm (hasta 1 decimal).
        La tarifa base es la fila de `tarifas` con la vigencia mas reciente.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QuoteRequest'
            example:
              ubigeo_destino: "150140"
              peso_kg: 25
              largo_cm: 12
              ancho_cm: 30
              alto_cm: 20
      responses:
        '200':
          description: Cotizacion calculada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
        '503':
          description: No hay una tarifa base vigente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: No hay una tarifa base vigente
                error: tarifa_no_configurada

  /api/v1/packages:
    get:
      tags: [Paquetes (prÃ³ximamente)]
      summary: '[Pendiente] Listar paquetes'
      responses:
        '501':
          $ref: '#/components/responses/NotImplemented'
    post:
      tags: [Paquetes (prÃ³ximamente)]
      summary: Registrar paquete con asignacion automatica de lote
      operationId: registerPackage
      description: |
        Solo OPERADOR con sede y cambio inicial de password completado.
        La sede, tracking, estado, precio y lote los establece el backend.
        Calcula el precio en PHP con la tarifa vigente y el mismo calculo de /quotes.
        Solicita a Python la asignacion y guarda remitente, lote, paquete e historial
        en una transaccion. No requiere llamar a /quotes antes del registro.
        Si no hay tarifa vigente o falla Python, responde 503 sin guardado parcial.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterPackageRequest'
      responses:
        '201':
          description: Registro atomico completado con precio real y lote asignado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegisterPackageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: Conflicto de registros concurrentes; volver a intentar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Campos invalidos o sede/distrito inexistente o inactivo; campos contiene los errores del formulario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: datos_invalidos
                message: Revisa los campos del paquete
                campos:
                  peso_kg: Debe estar entre 0.1 y 50 kg
        '503':
          description: Tarifa ausente/invalida o fallo del servicio de asignacion; sin guardado parcial
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                cotizacionNoDisponible:
                  value:
                    error: cotizacion_no_disponible
                    message: Servicio de cotizacion no disponible
                asignacionNoDisponible:
                  value:
                    error: asignacion_no_disponible
                    message: Servicio de asignacion no disponible

  /api/v1/packages/{id}:
    get:
      tags: [Paquetes (prÃ³ximamente)]
      summary: '[Pendiente] Consultar paquete por ID'
      parameters:
        - $ref: '#/components/parameters/PackageId'
      responses:
        '501':
          $ref: '#/components/responses/NotImplemented'

  /api/v1/packages/{id}/history:
    get:
      tags: [Paquetes (prÃ³ximamente)]
      summary: '[Pendiente] Historial del paquete'
      parameters:
        - $ref: '#/components/parameters/PackageId'
      responses:
        '501':
          $ref: '#/components/responses/NotImplemented'

  /api/v1/batches:
    get:
      tags: [Lotes]
      summary: Listar lotes
      description: |
        Requiere rol OPERADOR o CONDUCTOR.

        - **Operador:** lotes de su sede (la sede sale de la sesion). Sin filtro `estado` devuelve todos los estados.
        - **Conductor:** solo sus lotes. Sin filtro `estado` devuelve los Asignados y En Ruta.

        Orden: los lotes `EN_PREPARACION` salen del mas antiguo al mas nuevo (es el que se despacha primero);
        el resto, del mas nuevo al mas antiguo. Los lotes se crean solos al registrar un paquete y el conductor
        se asigna al despachar.
      security:
        - bearerAuth: []
      parameters:
        - name: estado
          in: query
          required: false
          schema:
            type: string
            enum: [EN_PREPARACION, ASIGNADO, EN_RUTA, CERRADO]
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: size
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Pagina de lotes
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          description: Filtro invalido (estado, page o size)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: El filtro estado debe ser EN_PREPARACION, ASIGNADO, EN_RUTA o CERRADO
                error: filtro_invalido
    post:
      tags: [Lotes (prÃ³ximamente)]
      summary: '[Pendiente] Crear lote'
      responses:
        '501':
          $ref: '#/components/responses/NotImplemented'

  /api/v1/batches/{id}:
    get:
      tags: [Lotes]
      summary: Consultar un lote
      description: |
        Requiere rol OPERADOR o CONDUCTOR.

        - **Operador** (solo lotes de su sede): resumen, progreso, paquetes, `version` y, si el lote esta
          `EN_PREPARACION`, los conductores disponibles con su placa. Son los activos que manejan el mismo tipo de
          vehiculo del lote y tienen menos de 3 lotes pendientes (Asignados o En Ruta); primero los que no estan
          en ruta. No incluye datos personales del destinatario.
        - **Conductor** (solo sus lotes): resumen, progreso y las paradas en orden de entrega, con destinatario y direccion.

        Envie la `version` recibida al despachar.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BatchId'
      responses:
        '200':
          description: Detalle del lote (la forma depende del rol)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/BatchDetailOperatorResponse'
                  - $ref: '#/components/schemas/BatchDetailDriverResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Lote de otra sede o de otro conductor, o rol sin permiso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: No puede ver lotes de otra sede
                error: sin_permisos
        '404':
          description: El lote no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: El lote no existe
                error: lote_no_encontrado
        '422':
          description: Id invalido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: El id del lote no es valido
                error: id_invalido

  /api/v1/batches/{id}/dispatch:
    post:
      tags: [Lotes]
      summary: Despachar un lote a un conductor
      description: |
        Requiere rol OPERADOR y un lote de su sede en estado `EN_PREPARACION`.

        1. Lee el lote y pide a Python el orden de las paradas (vecino mas cercano desde la sede).
        2. En una sola transaccion bloquea el lote, sus paquetes y el conductor, y revalida todo.
        3. Guarda el conductor, el operador que despacha y la fecha; pasa el lote a `ASIGNADO` y sus paquetes a
           `ASIGNADO` con su numero de parada; registra un evento de historial por paquete; incrementa `version`.

        Si entra un paquete nuevo mientras se calcula la ruta, el despacho se repite (hasta 3 intentos) para que el
        orden incluya todos los paquetes del lote.

        El conductor debe estar activo, manejar el tipo de vehiculo del lote y tener menos de 3 lotes pendientes.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BatchId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DispatchBatchRequest'
            example:
              id_conductor: 31
              version: 0
      responses:
        '200':
          description: Lote despachado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DispatchBatchResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Lote de otra sede, rol sin permiso o contrasena temporal sin cambiar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: No puede despachar lotes de otra sede
                error: sin_permisos
        '404':
          description: El lote no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: El lote no existe
                error: lote_no_encontrado
        '409':
          description: |
            Conflicto. `error` puede ser:
            `lote_ya_despachado` (otro operador se adelanto; el mensaje nombra al operador y al conductor),
            `version_desactualizada` (la version enviada no es la actual),
            `lote_cambio` (el lote cambio durante el despacho y se agotaron los reintentos),
            `lote_vacio` o
            `conductor_no_disponible` (inactivo o con 3 lotes pendientes).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                loteYaDespachado:
                  value:
                    message: Este lote ya fue despachado por Ana Torres a Luis Ramos
                    error: lote_ya_despachado
                conductorNoDisponible:
                  value:
                    message: El conductor ya no esta disponible
                    error: conductor_no_disponible
        '422':
          description: |
            Cuerpo o id invalidos (`campo_obligatorio`, `campo_invalido`, `id_invalido`) o conductor inexistente
            o que no maneja el tipo de vehiculo del lote (`referencia_invalida`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: El conductor no maneja el tipo de vehiculo del lote
                error: referencia_invalida
        '503':
          description: El servicio de rutas (Python) no esta disponible. No se guarda nada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: Servicio de rutas no disponible
                error: ruta_no_disponible

