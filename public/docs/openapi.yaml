        '501':
          $ref: '#/components/responses/NotImplemented'
    post:
      tags: [Lotes (prÃ³ximamente)]
      summary: '[Pendiente] Crear lote'
      responses:
        '501':
          $ref: '#/components/responses/NotImplemented'

  /api/v1/batches/{id}:
    get:
      tags: [Lotes (prÃ³ximamente)]
      summary: '[Pendiente] Consultar lote'
      parameters:
        - $ref: '#/components/parameters/BatchId'
      responses:
        '501':
          $ref: '#/components/responses/NotImplemented'

  /api/v1/batches/{id}/assignment:
    patch:
      tags: [Lotes (prÃ³ximamente)]
      summary: '[Pendiente] Asignar lote'
