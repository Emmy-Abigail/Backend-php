              type: string
              nullable: true
              maxLength: 10
            lote:
              type: string
              nullable: true
              maxLength: 10
            referencia:
              type: string
              nullable: true
              maxLength: 255
        peso_kg:
          description: Entre 0.1 y 50 kg; hasta 2 decimales efectivos, sin redondeo silencioso
          oneOf:
            - type: number
              minimum: 0.1
              maximum: 50
              multipleOf: 0.01
            - type: string
              pattern: '^[0-9]+(\.[0-9]+)?$'
