          $ref: '#/components/responses/NotImplemented'

  /api/v1/batches/{id}:
    get:
      tags: [Lotes]
      summary: Consultar un lote
      description: |
        Requiere rol OPERADOR o CONDUCTOR.

        - **Operador** (solo lotes de su sede): resumen, progreso, paquetes, `version` y, si el lote esta
          `EN_PREPARACION`, los conductores disponibles con su placa. Son los activos que manejan el mismo tipo de
          vehiculo del lote y tienen menos de 3 lotes pendientes (Asignados o En Ruta); primero los que no estan
          en ruta. No incluye datos personales del destinatario.
        - **Conductor** (solo sus lotes): resumen, progreso y las paradas en orden de entrega, con destinatario y direccion.

        Envie la `version` recibida al despachar.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/BatchId'
      responses:
        '200':
          description: Detalle del lote (la forma depende del rol)
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/BatchDetailOperatorResponse'
                  - $ref: '#/components/schemas/BatchDetailDriverResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Lote de otra sede o de otro conductor, o rol sin permiso
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: No puede ver lotes de otra sede
                error: sin_permisos
        '404':
          description: El lote no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                message: El lote no existe
                error: lote_no_encontrado
        '422':
          description: Id invalido
