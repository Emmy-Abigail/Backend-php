  /api/v1/packages/{id}/evidence:
    get:
      tags: [Entregas]
      summary: Consultar la foto privada de entrega
      operationId: getPackageEvidence
      description: |
        HU-46. Solo ADMINISTRADOR u OPERADOR activo con el cambio inicial de password
        completado. El administrador puede consultar cualquier sede; el operador,
        exclusivamente paquetes de su sede (id_sede del usuario autenticado).
        CONDUCTOR y clientes no tienen acceso, aunque el conductor haya subido la foto.
        Solo hay evidencia disponible si el estado actual del paquete es ENTREGADO
        y el ultimo evento ENTREGADO tiene una clave y un archivo privado disponible.
        Ordena esos eventos por created_at e id descendentes; no recupera una foto
        anterior cuando el ultimo evento de entrega carece de evidencia.
        La evidencia sigue disponible despues de cerrar el lote.
        Devuelve los bytes de la imagen JPEG/PNG, sin redirigir a una URL publica ni
        exponer la evidencia_key, el nombre original o la ruta del archivo.
        Tanto el exito como los errores llevan Cache-Control private, no-store,
        Pragma no-cache, Vary Authorization y X-Content-Type-Options nosniff.
        HEAD aplica los mismos permisos y cabeceras y devuelve un cuerpo vacio.
        Las cabeceras condicionales no evitan la autenticacion ni generan respuestas 304.
        No cambia estados, historial o archivos, ni consulta Python.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PackageId'
      responses:
        '200':
          description: Foto privada de la entrega
          headers:
            Cache-Control:
              schema:
                type: string
                enum: ['private, no-store']
            Content-Disposition:
              description: Nombre generado por el servidor, sin la clave privada del archivo
              schema:
                type: string
                example: 'inline; filename="evidencia-42.jpg"'
            Content-Length:
              schema:
                type: integer
                minimum: 1
            X-Content-Type-Options:
              schema:
                type: string
                enum: [nosniff]
            Vary:
              schema:
                type: string
                example: Authorization
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Rol no permitido, cambio inicial pendiente, operador sin sede o de otra sede
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Paquete inexistente o evidencia no disponible; estados distintos de ENTREGADO, sin foto o archivo ausente/invalido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                paqueteInexistente:
                  value:
                    error: paquete_no_encontrado
                    message: El paquete no existe
                sinEvidencia:
                  value:
                    error: evidencia_no_encontrada
                    message: No hay evidencia disponible para este paquete
        '422':
          description: El id del paquete no es valido
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: No se pudo consultar la evidencia; no se exponen detalles internos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Almacenamiento privado no disponible o archivo temporalmente ilegible
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /api/v1/packages/{id}/final-status:
    post:
      tags: [Entregas]
      summary: Registrar entrega o fallo y cerrar automaticamente el lote
      operationId: finalizePackage
      description: |
        HU-41 a HU-45. Solo el CONDUCTOR activo del lote, con el cambio inicial de
        password completado. Tanto el lote como el paquete deben estar EN_RUTA.
        ENTREGADO requiere una foto JPEG/PNG valida de hasta 5242880 bytes (5 MiB),
        admite observacion opcional y no admite id_motivo. Se verifica el contenido
        decodificando la imagen, sin confiar en nombre, extension o MIME declarados.
        Una resolucion que exceda la memoria disponible del servidor se rechaza con 422;
        el cliente debe reducir las dimensiones antes de reintentar.
        FALLIDO requiere id_motivo del catalogo y observacion no vacia; no admite foto.
        Las observaciones se recortan y admiten hasta 65535 bytes de texto UTF-8.
        La foto se guarda fuera de public con una clave aleatoria privada.
        Si falla el almacenamiento, no se cambia el estado ni se guarda historial.
        Guarda estado e historial en una transaccion; cuando todos los paquetes son
        ENTREGADO/FALLIDO, cierra el lote y guarda closed_at en esa misma transaccion.
        Las peticiones simultaneas se serializan por lote. Un paquete finalizado
        devuelve 409 ante cualquier nuevo intento, sin duplicar eventos o evidencias.
        Fechas persistidas en UTC y devueltas en ISO 8601 con hora de Lima (-05:00).
        No consulta Python. La confirmacion y compresion de fotos corresponden al frontend.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PackageId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              oneOf:
                - type: object
                  required: [estado, foto]
                  not:
                    required: [id_motivo]
                  properties:
                    estado:
                      type: string
                      enum: [ENTREGADO]
                    foto:
                      type: string
                      format: binary
                      description: JPEG o PNG real de hasta 5242880 bytes
                    observacion:
                      type: string
                      description: Opcional, hasta 65535 bytes UTF-8
                - type: object
                  required: [estado, id_motivo, observacion]
                  not:
                    required: [foto]
                  properties:
                    estado:
                      type: string
                      enum: [FALLIDO]
                    id_motivo:
                      type: integer
                      minimum: 1
                      description: ID de GET /api/v1/failure-reasons o GET /api/v1/catalogs
                    observacion:
                      type: string
                      minLength: 1
                      description: Obligatoria y no vacia tras recortar espacios, hasta 65535 bytes UTF-8
      responses:
        '200':
          description: Estado final e historial guardados; lote cerrado si ya no quedan pendientes
          content:
            application/json:
              schema:
                type: object
                required: [id, tracking_id, estado, fecha, tiene_evidencia, lote]
                properties:
                  id:
                    type: integer
                  tracking_id:
                    type: string
                  estado:
                    type: string
                    enum: [ENTREGADO, FALLIDO]
                  fecha:
                    type: string
                    format: date-time
                  tiene_evidencia:
                    type: boolean
                  lote:
                    type: object
                    required: [id, estado, closed_at]
                    properties:
                      id:
                        type: integer
                      estado:
                        type: string
                        enum: [EN_RUTA, CERRADO]
                      closed_at:
                        type: string
                        format: date-time
                        nullable: true
              example:
                id: 42
                tracking_id: RIVA-A1B2C3D4
                estado: ENTREGADO
                fecha: '2026-10-24T10:30:00-05:00'
                tiene_evidencia: true
                lote:
                  id: 210
                  estado: CERRADO
                  closed_at: '2026-10-24T10:30:00-05:00'
        '400':
          description: El lote o el paquete no estan EN_RUTA
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Rol no permitido, cambio inicial pendiente o paquete ajeno
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: El paquete no existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Paquete ya finalizado o conflicto concurrente; sin duplicar historial
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Formulario, motivo o foto invalidos; imagen incompleta, demasiado grande o de otro formato
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: No se pudo confirmar el resultado; consultar el paquete antes de reintentar
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '503':
          description: Almacenamiento privado o soporte de imagen no disponible; sin cambio de estado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

